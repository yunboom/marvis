name: PostgreSQL bundle

# Repackages a pinned zonky embedded-postgres-binaries release from Maven
# Central into the PostgreSQL bundles the desktop app downloads for standalone
# mode, and publishes them on a `pg-<version>` release that is never marked
# latest. Run it once per PostgreSQL version; the Release workflow's
# standalone-bundles job reads that release's postgres-manifest.json.

on:
  workflow_dispatch:
    inputs:
      pg_version:
        description: zonky embedded-postgres-binaries version, e.g. 17.11.0
        required: true
        default: "17.11.0"

permissions:
  contents: write

concurrency:
  group: postgres-bundle-${{ inputs.pg_version }}
  cancel-in-progress: false

jobs:
  repack:
    if: github.repository_owner == 'yunboom'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repack zonky bundles
        env:
          PG_VERSION: ${{ inputs.pg_version }}
        run: |
          set -euo pipefail
          # zonky platform : bundle platform. zonky has no Windows arm64 build;
          # the manifest points windows-arm64 at the windows-amd64 bundle.
          for pair in darwin-amd64:darwin-amd64 darwin-arm64v8:darwin-arm64 \
                      linux-amd64:linux-amd64 linux-arm64v8:linux-arm64 \
                      windows-amd64:windows-amd64; do
            bash scripts/repack-postgres.sh "${pair%%:*}" "$PG_VERSION" "${pair##*:}" dist
          done
          node scripts/build-standalone-manifest.mjs postgres --dir dist \
            --version "$PG_VERSION" --tag "pg-$PG_VERSION" > dist/postgres-manifest.json
          ls -l dist

      - name: Publish pg-${{ inputs.pg_version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PG_VERSION: ${{ inputs.pg_version }}
        run: |
          set -euo pipefail
          tag="pg-$PG_VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --latest=false \
              --title "PostgreSQL $PG_VERSION for standalone mode" \
              --notes "PostgreSQL $PG_VERSION repackaged from zonky embedded-postgres-binaries for the desktop standalone mode."
          fi
          gh release upload "$tag" dist/* --clobber
