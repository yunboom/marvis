# Development override: build the backend/web images from the current checkout
# instead of pulling the official GHCR images.

services:
  backend:
    image: marvis-backend:dev
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        DATE: ${DATE:-unknown}
        # Path prefix the app is served under, e.g. /marvis. Build-time only;
        # the backend uses it to build web links.
        MARVIS_BASE_PATH: ${MARVIS_BASE_PATH:-}

  frontend:
    image: marvis-web:dev
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_APP_VERSION: dev
        # Path prefix the app is served under, e.g. /marvis. Build-time only.
        MARVIS_BASE_PATH: ${MARVIS_BASE_PATH:-}

  docs:
    image: marvis-docs:dev
    build:
      context: .
      dockerfile: Dockerfile.docs
      args:
        MARVIS_BASE_PATH: ${MARVIS_BASE_PATH:-}
