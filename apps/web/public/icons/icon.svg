<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Marvis">
  <!--
    Full-bleed source for the generated home-screen icons (apple-touch-icon.png,
    icon-maskable-512.png). Full-bleed because both surfaces mask the artwork
    themselves: iOS rounds the corners, Android crops to the launcher shape.
    The mark is /favicon.svg's "M", held at 46% of the canvas so it stays
    inside the maskable safe zone (the centre circle of 80% diameter).
    See app/manifest.ts for the regeneration commands.
  -->
  <rect width="512" height="512" fill="#0f0f0f"/>
  <polygon fill="#ffffff" transform="scale(5.12)" points="27,70 27,30 39,30 50,50 61,30 73,30 73,70 63,70 63,46 54,62 46,62 37,46 37,70"/>
</svg>
