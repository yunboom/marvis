<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Marvis 所有版本</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#f7f7f7}
a{color:#0f0f0f;text-decoration:none}a:hover{color:#7b4835}
.mac-hint:hover{background:#ead9cf !important}
.m-only{display:none !important}
@media (max-width: 720px){
  .d-only{display:none !important}
  .m-only{display:flex !important}
  .wrap{padding-left:20px !important;padding-right:20px !important}
  .page-h1{font-size:30px !important}
  .page{padding-top:32px !important}
}
</style>
</helmet>
<div style="position: relative; background: #f7f7f7; color: #0f0f0f; font-family: 'PingFang SC', 'Noto Sans SC', system-ui, sans-serif; font-size: 16px; line-height: 1.6">

  <header class="wrap" style="max-width: 1200px; margin: 0 auto; padding: 20px 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px">
      <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 8px; background: #0f0f0f; color: #ffffff; display: grid; place-items: center; font-weight: 700; font-size: 15px">M</span>
      <span style="font-weight: 600; font-size: 18px">Marvis</span>
    </a>
    <div style="display: flex; align-items: center; gap: 8px">
      <a class="d-only" href="Changelog.dc.html" style="height: 40px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; font-size: 15px; color: #444444">更新日志</a>
      <a href="#start" style="height: 40px; padding: 0 18px; border-radius: 999px; background: #0f0f0f; color: #ffffff; display: flex; align-items: center; font-size: 14px; font-weight: 500">开始使用</a>
      <button class="m-only" type="button" aria-label="打开导航菜单" style="width: 40px; height: 40px; border-radius: 999px; border: 0; background: #ffffff; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0f0f0f" stroke-width="2" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </header>

  <main class="wrap page" style="max-width: 880px; margin: 0 auto; padding: 48px 32px 96px; display: flex; flex-direction: column; gap: 28px">
    <a href="Download.dc.html" style="align-self: flex-start; font-size: 14px; color: #666666">‹ 下载</a>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 class="page-h1" style="margin: 0; font-size: 40px; font-weight: 600">所有版本</h1>
      <p style="margin: 0; color: #666666">点开一个版本，选择你的平台下载。</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{releases}}" as="r" hint-placeholder-count="5">
        <div style="border-radius: 20px; background: #ffffff; overflow: hidden">
          <div style="display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 20px">
            <button type="button" onClick="{{r.toggle}}" aria-expanded="{{r.expandedAttr}}" style="flex: 1 1 auto; min-width: 0; min-height: 52px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; background: none; border: 0; padding: 0; font: inherit; text-align: left; color: #0f0f0f; cursor: pointer">
              <span style="font-size: 17px; font-weight: 600">v{{r.version}}</span>
              <sc-if value="{{r.latest}}" hint-placeholder-val="{{false}}">
                <span style="height: 22px; padding: 0 8px; border-radius: 999px; background: #0f0f0f; color: #ffffff; font-size: 12px; display: flex; align-items: center">最新</span>
              </sc-if>
              <span style="font-size: 13px; color: #888888">{{r.date}}</span>
            </button>
            <a href="ReleaseDetail.dc.html" style="flex: none; height: 36px; padding: 0 14px; border-radius: 999px; display: flex; align-items: center; font-size: 13px; color: #666666">更新内容 ›</a>
            <button type="button" onClick="{{r.toggle}}" aria-label="{{r.toggleLabel}}" aria-expanded="{{r.expandedAttr}}" style="flex: none; width: 36px; height: 36px; border-radius: 999px; border: 0; background: #f2f2f2; display: grid; place-items: center; cursor: pointer">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0f0f0f" stroke-width="2.2" aria-hidden="true" style="{{r.chevronStyle}}"><path d="m6 9 6 6 6-6"/></svg>
            </button>
          </div>
          <sc-if value="{{r.expanded}}" hint-placeholder-val="{{false}}">
            <div style="border-top: 1px solid rgba(0,0,0,0.06)">
              <sc-for list="{{platforms}}" as="p" hint-placeholder-count="6">
                <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 20px; border-bottom: 1px solid rgba(0,0,0,0.04)">
                  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
                    <span style="font-size: 15px">{{p.name}}</span>
                    <sc-if value="{{p.mac}}" hint-placeholder-val="{{false}}">
                      <button class="mac-hint" type="button" onClick="{{openHint}}" aria-haspopup="dialog" style="height: 24px; padding: 0 9px 0 7px; border-radius: 999px; border: 0; background: #f2ebe7; color: #7b4835; font: inherit; font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 4px; cursor: pointer">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg>
                        首次打开须知
                      </button>
                    </sc-if>
                  </div>
                  <div style="display: flex; flex-wrap: wrap; gap: 6px">
                    <sc-for list="{{p.formats}}" as="f" hint-placeholder-count="2">
                      <a href="#asset" style="height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(0,0,0,0.12); display: flex; align-items: center; font-size: 13px">{{f}}</a>
                    </sc-for>
                  </div>
                </div>
              </sc-for>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </main>

  <sc-if value="{{hintOpen}}" hint-placeholder-val="{{false}}">
    <dc-import name="MacHintDialog" on-close="{{closeHint}}" hint-size="100%,100%"></dc-import>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { expanded: '0.7.3', hint: false };
  }
  renderVals() {
    const expanded = this.state.expanded;
    const row = (version, date, latest) => {
      const isOpen = version === expanded;
      return {
        version, date, latest,
        expanded: isOpen,
        expandedAttr: isOpen ? 'true' : 'false',
        toggleLabel: isOpen ? '收起安装包' : '展开安装包',
        chevronStyle: isOpen ? 'transform: rotate(180deg)' : '',
        toggle: () => this.setState({ expanded: isOpen ? null : version })
      };
    };
    return {
      hintOpen: this.state.hint,
      openHint: () => this.setState({ hint: true }),
      closeHint: () => this.setState({ hint: false }),
      releases: [
        row('0.7.3', '2026 年 10 月 28 日', true),
        row('0.7.2', '2026 年 10 月 28 日', false),
        row('0.7.0', '2026 年 10 月 23 日', false),
        row('0.6.5', '2026 年 10 月 21 日', false),
        row('0.6.4', '2026 年 10 月 20 日', false)
      ],
      platforms: [
        { name: 'macOS · Apple Silicon', mac: true, formats: ['.dmg', '.zip'] },
        { name: 'macOS · Intel', mac: true, formats: ['.dmg', '.zip'] },
        { name: 'Windows · x64', mac: false, formats: ['.exe'] },
        { name: 'Windows · ARM64', mac: false, formats: ['.exe'] },
        { name: 'Linux · x64', mac: false, formats: ['.AppImage', '.deb'] },
        { name: 'Linux · ARM64', mac: false, formats: ['.AppImage', '.deb'] }
      ]
    };
  }
}
</script>
</body>
</html>
