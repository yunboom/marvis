<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>消息 · 评审通知</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/ec070e18ef59b2b36beba8dc45712468">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #f7f7f7; font-family: 'PingFang SC','Noto Sans SC',-apple-system,system-ui,sans-serif; color: #0f0f0f">
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,.28)"></div>
  <section role="dialog" aria-label="消息" style="position: absolute; left: 48px; top: 32px; width: 1344px; height: 836px; background: #fff; border-radius: 20px; box-shadow: 0 24px 64px rgba(0,0,0,.18); display: flex; overflow: hidden">
    <div style="width: 340px; flex: none; border-right: 1px solid rgba(0,0,0,.06); display: flex; flex-direction: column">
      <div style="height: 72px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 20px">
        <h1 style="margin: 0; font-size: 22px; font-weight: 700">消息</h1><span class="muted" style="font-size: 14px; flex: 1">{{unread}}</span>
        <button class="btn" style="height: 30px; font-size: 13px; gap: 6px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m2 12 5 5L18 6M12 17l10-10"></path></svg>全部标为已读</button>
        <button class="ib" aria-label="筛选"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg></button>
        <button class="ib" aria-label="更多操作"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg></button>
      </div>
      <div style="padding: 0 8px; display: flex; flex-direction: column; gap: 2px">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
          <div role="button" tabindex="0" style="{{r.style}}">
            <span class="av" style="width: 36px; height: 36px; font-size: 14px; flex: none">{{r.av}}</span>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
              <div style="display: flex; align-items: center; gap: 6px"><sc-if value="{{r.unread}}" hint-placeholder-val="{{ false }}"><span style="width: 6px; height: 6px; border-radius: 3px; background: #7b4835; flex: none"></span></sc-if><span style="{{r.titleStyle}}">{{r.title}}</span></div>
              <div style="display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #666"><span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.detail}}</span><span>{{r.time}}</span></div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <div style="height: 48px; flex: none; display: flex; align-items: center; justify-content: flex-end; padding: 0 12px"><button class="ib" aria-label="关闭"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
      <article style="max-width: 680px; padding: 0 40px 36px; display: flex; flex-direction: column; gap: 14px">
        <div><h2 style="margin: 0; font-size: 20px; font-weight: 700">#16 去重键改为渠道交易号，补回调人工处理</h2><p class="muted" style="margin: 6px 0 0; font-size: 14px">{{typeLine}}</p></div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 14px"><span class="av">{{actorAv}}</span><span><span style="font-weight: 500">{{actor}}</span> {{actText}}</span></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><span class="faint" style="font-size: 12.5px">{{summaryLabel}}</span><div style="background: #f5f5f5; border-radius: 10px; padding: 10px 14px; font-size: 14px">去重原因和生效时间补上后再合并。</div></div>
        <div style="display: flex; flex-direction: column; gap: 10px"><span class="faint" style="font-size: 12.5px">意见</span>
          <div style="display: flex; flex-direction: column; gap: 4px; padding-bottom: 10px; border-bottom: 1px solid rgba(0,0,0,.05)"><span style="font-size: 12.5px; color: #5c5c5c; background: #f7f7f7; border-radius: 8px; padding: 4px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">支付回调 第 15 行 · 渠道回调按渠道交易号加幂等键去重，重复回调直接返回成功。</span><span style="font-size: 14px">补一下改成交易号的原因和生效时间。</span></div>
          <div style="display: flex; flex-direction: column; gap: 4px; padding-bottom: 10px; border-bottom: 1px solid rgba(0,0,0,.05)"><span class="faint" style="font-size: 12.5px">回调人工处理</span><span style="font-size: 14px">缺少值班联系人和升级路径。</span></div>
          <a href="#" style="font-size: 13px; color: #4f6f8a; text-decoration: none">查看全部 3 条意见</a>
        </div>
        <div style="display: flex; gap: 8px; padding-top: 4px"><button class="btn btn-p">{{primary}}</button><button class="btn" style="gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1"></rect><path d="M5 9v10h14V9M10 13h4"></path></svg>归档</button></div>
      </article>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"viewer":{"editor":"enum","default":"owner","options":["owner","reviewer"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var owner = (this.props.viewer ?? 'owner') === 'owner';
    var base = 'display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; cursor: default; ';
    var rows = owner ? [
      { av: '王', title: '#16 去重键改为渠道交易号，补回调人工处理', detail: '王芳 提交了评审 · 3 条意见', time: '2 分钟', unread: true, sel: true },
      { av: '李', title: '#13 合并重复页面：幂等键 / 幂等设计', detail: '李雷 重新请求审核', time: '1 天', unread: false, sel: false },
      { av: '韩', title: 'MAR-150 退款回调重复入账', detail: '新评论', time: '2 天', unread: false, sel: false }
    ] : [
      { av: '木', title: '#16 去重键改为渠道交易号，补回调人工处理', detail: '木卫五 重新请求审核', time: '刚刚', unread: true, sel: true },
      { av: '李', title: '#12 配置知识库：引用必须附核对版本', detail: '李雷 提交了评审 · 1 条意见', time: '3 天', unread: false, sel: false },
      { av: '韩', title: 'MAR-150 退款回调重复入账', detail: '新评论', time: '2 天', unread: false, sel: false }
    ];
    rows = rows.map(function (r) {
      return Object.assign({}, r, {
        style: base + 'background: ' + (r.sel ? 'rgba(0,0,0,.055)' : 'transparent'),
        titleStyle: 'font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; ' + (r.unread ? 'font-weight: 600' : 'color: #666')
      });
    });
    return {
      rows: rows, unread: '1',
      typeLine: owner ? '提交了评审 · 2 分钟前' : '重新请求审核 · 刚刚',
      actorAv: owner ? '王' : '木', actor: owner ? '王芳' : '木卫五',
      actText: owner ? '提交了评审，变更请求改为「待解决」' : '重新请求审核，变更请求回到「待审核」',
      summaryLabel: owner ? '评审总结' : '你的评审总结',
      primary: owner ? '查看审核意见' : '去审核页'
    };
  }
}
</script>
</body>
</html>
