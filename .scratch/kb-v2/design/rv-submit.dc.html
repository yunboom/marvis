<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>提交评审弹层</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/ec070e18ef59b2b36beba8dc45712468">
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; font-family: 'PingFang SC','Noto Sans SC',-apple-system,system-ui,sans-serif; color: #0f0f0f"><dc-import name="rv-list" review="pending" hint-size="1440px,900px"></dc-import>
  <div class="menu" role="dialog" aria-label="提交评审" style="bottom: 74px; right: 470px; width: 360px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 14px; font-weight: 600">提交评审</div>
    <label for="rv-sum" class="faint" style="font-size: 12.5px">总结（选填）</label>
    <textarea id="rv-sum" rows="3" style="border: 0; border-radius: 10px; background: #f5f5f5; padding: 8px 10px; font: inherit; font-size: 13.5px; resize: none">去重原因和生效时间补上后再合并。</textarea>
    <div class="muted" style="font-size: 12.5px">3 条评论将对所有人可见，变更请求改为「待解决」，并通知负责人。</div>
    <div style="display: flex; justify-content: flex-end; gap: 8px"><button class="btn btn-g">取消</button><button class="btn btn-p">提交评审</button></div>
  </div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
