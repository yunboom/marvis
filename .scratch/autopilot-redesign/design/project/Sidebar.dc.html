<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>侧栏</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="侧栏" style="width: 216px; height: 868px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border: 1px solid rgba(0,0,0,0.06); border-radius: 24px; padding: 14px 12px; font-family: 'PingFang SC', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif; color: #0f0f0f; font-size: 14px">
  <div style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 2px 0 8px">
    <span style="width: 22px; height: 22px; border-radius: 6px; background: #0f0f0f; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">M</span>
    <span style="flex: 1; font-size: 21px; font-weight: 700; letter-spacing: -0.01em; line-height: 1">Marvis</span>
    <button type="button" aria-label="新建任务" style="width: 32px; height: 32px; border: 0; border-radius: 16px; background: transparent; color: #0f0f0f; display: inline-flex; align-items: center; justify-content: center; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
  </div>
  <button type="button" style="margin-top: 10px; display: flex; align-items: center; gap: 10px; height: 40px; box-sizing: border-box; padding: 0 11px; border: 1px solid rgba(0,0,0,0.1); border-radius: 12px; background: transparent; color: #666666; font: inherit; font-size: 14px; text-align: left">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 11a7 7 0 1 0 14 0a7 7 0 1 0-14 0M20 20l-3.5-3.5"></path></svg>
    <span style="flex: 1">搜索...</span>
  </button>
  <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 2px">
    <sc-for list="{{personal}}" as="it" hint-placeholder-count="2">
      <a href="#" style="{{it.style}}">{{it.label}}</a>
    </sc-for>
  </div>
  <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
    <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 2px">
      <div style="height: 30px; display: flex; align-items: center; padding: 0 12px; font-size: 13px; color: #666666">{{g.label}}</div>
      <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
        <a href="#" style="{{it.style}}">{{it.label}}</a>
      </sc-for>
    </div>
  </sc-for>
  <div style="flex: 1"></div>
  <div style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px">
    <span style="width: 24px; height: 24px; border-radius: 7px; background: #0f0f0f; color: #ffffff; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">支</span>
    <span style="flex: 1; font-size: 14px">支付中台</span>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["autopilots","issues","chat"],"default":"autopilots"},"$preview":{"width":216,"height":868}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'autopilots';
    const item = (key, label) => ({
      label,
      style: 'display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; border-radius: 10px; color: #0f0f0f; font-size: 14px; text-decoration: none; background: ' + (key === active ? '#f2f2f2' : 'transparent'),
    });
    return {
      personal: [item('mine', '我的任务'), item('chat', '我的对话')],
      groups: [
        { label: '工作区', items: [item('issues', '任务'), item('projects', '项目'), item('autopilots', '自动化'), item('kb', '知识库')] },
        { label: '配置', items: [item('agents', '智能体'), item('squads', '小队'), item('runtimes', '运行时')] },
      ],
    };
  }
}
</script>
</body>
</html>
