<title>自动化改版原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 布局：沿用 Marvis 设计稿画布（09 自动化 / 46 侧栏 / 9.3 知识库作业）：#f7f7f7 外壳 16px 留白，侧栏与主区都是 24px 圆角白卡 */
:root {
  --bg: #f7f7f7; --card: #ffffff; --menu: #ffffff; --panel: #fcfcfc;
  --text: #0f0f0f; --muted: #666666; --faint: #858585;
  --border: rgba(0,0,0,0.06); --input-border: rgba(0,0,0,0.1); --composer-border: #e3e3e3;
  --soft: #f7f7f7; --fill: #f5f5f5; --hover: #f5f5f5; --active: #f2f2f2; --selected-row: rgba(0,0,0,0.035);
  --segment: rgba(0,0,0,0.04); --seg-on: #ffffff; --seg-shadow: 0 1px 2px rgba(0,0,0,0.06);
  --chip: rgba(0,0,0,0.05); --off: rgba(0,0,0,0.15);
  --brand: #7b4835; --tip: #1c1c1c;
  --av-bg: #ededed; --av-fg: #0f0f0f;
  /* 国画状态色（24 号规范） */
  --ink: #737373; --gamboge: #c48a2c; --indigo: #4a6f8a; --malachite: #3f7f5f; --cinnabar: #b8452f;
  --online: #23a55a;
  --warn-soft: rgba(196,138,44,0.10);
  --menu-shadow: 0 4px 12px rgba(0,0,0,0.12);
  --composer-shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.05);
  --note-bg: #fff8e6; --note-line: #f0d48a;
  --font: 'PingFang SC','Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono: 'SF Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0f0f0f; --card:#1a1a1a; --menu:#222222; --panel:#171717; --text:#f2f2f2; --muted:#999999; --faint:#6b6b6b;
  --border:rgba(255,255,255,0.08); --input-border:rgba(255,255,255,0.14); --composer-border:rgba(255,255,255,0.14);
  --soft:#141414; --fill:rgba(255,255,255,0.06); --hover:#222222; --active:#262626; --selected-row:rgba(255,255,255,0.05);
  --segment:rgba(255,255,255,0.06); --seg-on:#2c2c2c; --seg-shadow:none; --chip:rgba(255,255,255,0.08); --off:rgba(255,255,255,0.18);
  --brand:#c08a72; --tip:#2c2c2c; --av-bg:#2e2e2e; --av-fg:#f2f2f2;
  --ink:#a3a3a3; --gamboge:#e0b25a; --indigo:#86a8c4; --malachite:#84b89a; --cinnabar:#e07a64; --warn-soft:rgba(224,178,90,0.12);
  --menu-shadow:0 4px 12px rgba(0,0,0,0.5); --composer-shadow:none; --note-bg:#2a2414; --note-line:#5a4a1e; color-scheme:dark; } }
:root[data-theme="dark"] {
  --bg:#0f0f0f; --card:#1a1a1a; --menu:#222222; --panel:#171717; --text:#f2f2f2; --muted:#999999; --faint:#6b6b6b;
  --border:rgba(255,255,255,0.08); --input-border:rgba(255,255,255,0.14); --composer-border:rgba(255,255,255,0.14);
  --soft:#141414; --fill:rgba(255,255,255,0.06); --hover:#222222; --active:#262626; --selected-row:rgba(255,255,255,0.05);
  --segment:rgba(255,255,255,0.06); --seg-on:#2c2c2c; --seg-shadow:none; --chip:rgba(255,255,255,0.08); --off:rgba(255,255,255,0.18);
  --brand:#c08a72; --tip:#2c2c2c; --av-bg:#2e2e2e; --av-fg:#f2f2f2;
  --ink:#a3a3a3; --gamboge:#e0b25a; --indigo:#86a8c4; --malachite:#84b89a; --cinnabar:#e07a64; --warn-soft:rgba(224,178,90,0.12);
  --menu-shadow:0 4px 12px rgba(0,0,0,0.5); --composer-shadow:none; --note-bg:#2a2414; --note-line:#5a4a1e; color-scheme:dark; }

* { box-sizing: border-box; }
/* 画板固定 1440×900，按可用宽度等比缩放（同画布设计稿），不做响应式断点 */
.stage-wrap { position:relative; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:12px 24px; }
.stage-clip { position:relative; overflow:hidden; margin:0 auto; }
.stage { width:1440px; height:900px; transform-origin:top left; }
body { background: var(--bg); color: var(--text); font: 14px/1.6 var(--font); }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }
.tab { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); } .faint { color: var(--faint); }
svg { flex: none; }

/* 原型切换条（不属于产品界面） */
.proto-bar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding-block:10px 0; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); font-size:12px; color:var(--muted); }
.proto-bar b { color: var(--text); margin-right: 4px; }
.proto-bar button { border:1px solid var(--input-border); background:var(--card); border-radius:999px; padding:3px 10px; }
.proto-bar button[aria-pressed="true"] { background:var(--text); color:var(--card); border-color:var(--text); }

/* 外壳 */
.app { display:flex; gap:16px; width:1440px; height:900px; padding:16px; background:var(--bg); }
.side-panel.hide { display:none; }
.side { width:216px; flex:none; display:flex; flex-direction:column; background:var(--card); border:1px solid var(--border); border-radius:24px; padding:14px 12px; gap:2px; }
.logo { display:flex; align-items:center; gap:8px; height:36px; padding:0 4px 0 8px; }
.logo i { width:22px; height:22px; border-radius:6px; background:var(--text); color:var(--card); display:inline-flex; align-items:center; justify-content:center; font-style:normal; font-size:12px; font-weight:700; }
.logo span { flex:1; font-size:21px; font-weight:700; letter-spacing:-0.01em; }
.logo button { width:32px; height:32px; border-radius:16px; border:0; background:transparent; display:inline-flex; align-items:center; justify-content:center; }
.search { margin:10px 0 14px; display:flex; align-items:center; gap:10px; height:40px; padding:0 11px; border:1px solid var(--input-border); border-radius:12px; color:var(--muted); }
.nav { display:flex; align-items:center; gap:10px; height:34px; padding:0 12px; border-radius:10px; }
.nav.on { background: var(--active); }
.nav-group { padding:8px 12px 0; height:34px; display:flex; align-items:center; font-size:13px; color:var(--muted); }
.main { position:relative; flex:1; min-width:0; display:flex; flex-direction:column; background:var(--card); border:1px solid var(--border); border-radius:24px; overflow:hidden; }

/* 控件 */
.pill { display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 12px; border:1px solid var(--input-border); border-radius:16px; background:transparent; color:var(--muted); font-size:13px; white-space:nowrap; }
.pill:hover { background: var(--hover); }
.pill.on { border-color: transparent; background: var(--brand); color:#fff; }
.btn-p { display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 16px 0 14px; border:0; border-radius:18px; background:var(--text); color:var(--card); font-size:14px; font-weight:500; white-space:nowrap; }
.btn-p:hover { opacity:.88; }
.btn-p[disabled] { opacity:.4; cursor:not-allowed; }
.btn-o { display:inline-flex; align-items:center; gap:6px; height:36px; padding:0 14px; border:1px solid var(--input-border); border-radius:18px; background:transparent; font-size:14px; white-space:nowrap; }
.btn-o:hover { background: var(--hover); }
.ib { width:32px; height:32px; border-radius:16px; border:0; background:transparent; display:inline-flex; align-items:center; justify-content:center; color:var(--muted); }
.ib:hover { background: var(--hover); color: var(--text); }
.ib.sm { width:28px; height:28px; border-radius:14px; }
.seg { display:inline-flex; gap:2px; padding:3px; border-radius:16px; background:var(--segment); }
.seg button { display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 12px; border:0; border-radius:13px; background:transparent; color:var(--muted); font-size:13px; }
.seg button[aria-pressed="true"] { background:var(--seg-on); box-shadow:var(--seg-shadow); color:var(--text); font-weight:500; }
.seg .n { font-variant-numeric: tabular-nums; font-weight:400; color: var(--muted); }
.switch { width:36px; height:20px; border-radius:10px; background: var(--off); border:0; position:relative; padding:0; transition: background .2s; }
.switch::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:8px; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.2); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--text); }
.switch[aria-checked="true"]::after { transform: translateX(16px); }
.dot { width:6px; height:6px; border-radius:3px; display:inline-block; flex:none; }
.av { width:20px; height:20px; border-radius:10px; background:var(--av-bg); color:var(--av-fg); display:inline-flex; align-items:center; justify-content:center; font-size:10px; font-weight:600; flex:none; position:relative; }
.av.bot { border-radius:6px; }
.av.lg { width:24px; height:24px; font-size:11px; border-radius:12px; } .av.lg.bot { border-radius:7px; }
.av .st { position:absolute; right:-2px; bottom:-2px; width:7px; height:7px; border-radius:4px; border:1.5px solid var(--card); background: var(--online); }
.tag { display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 10px; border-radius:12px; background:var(--chip); font-size:12.5px; white-space:nowrap; }
.label { font-size:13px; color: var(--muted); }
.sep { color: var(--faint); padding: 0 6px; }

[hidden] { display:none !important; }

/* 改动说明（原型标注，不属于产品界面） */
.notes { position:fixed; z-index:40; right:max(24px, env(safe-area-inset-right,0px)); bottom:calc(24px + env(safe-area-inset-bottom,0px)); width:300px; max-width:calc(100% - 32px); display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
.notes-toggle { display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 12px; border:1px solid var(--note-line); border-radius:16px; background:var(--note-bg); font-size:12.5px; box-shadow:var(--menu-shadow); }
.notes-list { display:flex; flex-direction:column; gap:6px; max-height:60vh; overflow:auto; }
.note { background:var(--note-bg); border:1px solid var(--note-line); border-radius:12px; padding:9px 12px; font-size:12.5px; line-height:1.6; color:var(--text); box-shadow:var(--menu-shadow); }
.note b { display:block; margin-bottom:2px; }

/* 页头（同 09 自动化） */
.head { display:flex; align-items:center; gap:10px; height:72px; flex:none; padding:0 24px 0 28px; }
.head h1 { margin:0; font-size:24px; font-weight:700; }
.head .count { font-family: var(--mono); font-size:15px; font-variant-numeric: tabular-nums; color: var(--muted); }
.tabs { display:flex; gap:20px; height:40px; flex:none; padding:0 28px; border-bottom:1px solid var(--border); }
.tabs button { position:relative; height:40px; padding:0 2px; border:0; background:transparent; color:var(--muted); font-size:14px; }
.tabs button[aria-selected="true"] { color: var(--text); font-weight:500; }
.tabs button[aria-selected="true"]::after { content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; border-radius:1px; background: var(--text); }
.toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:56px; flex:none; padding:0 24px 0 28px; flex-wrap: wrap; }
.toolbar > div { display:flex; align-items:center; gap:8px; min-width:0; }
.scroll { flex:1; min-height:0; overflow:auto; }

/* 卡片网格 */
.cards { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:12px; padding: 4px 24px 96px; }
.ap { position:relative; display:flex; flex-direction:column; gap:6px; min-width:0; padding:16px 18px; border:1px solid var(--border); border-radius:16px; background:var(--card); text-align:left; cursor:pointer; transition: background .15s; }
.ap:hover { background: var(--hover); }
.ap.sel { background: var(--selected-row); border-color: var(--input-border); }
.ap-title { display:flex; align-items:center; gap:8px; min-width:0; padding-right:64px; font-size:15px; font-weight:600; }
.ap-title span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ap-desc { color: var(--muted); font-size:13.5px; line-height:1.65; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height: 3.3em; }
.ap-meta { display:flex; align-items:center; flex-wrap:wrap; row-gap:4px; font-size:13px; color: var(--muted); }
.ap-meta > span { display:inline-flex; align-items:center; gap:5px; white-space:nowrap; }
.ap-tools { position:absolute; top:12px; right:12px; display:flex; gap:2px; opacity:0; transition: opacity .15s; }
.ap:hover .ap-tools, .ap.sel .ap-tools, .ap-tools.open { opacity:1; }
.cbox { width:16px; height:16px; border-radius:5px; border:1.5px solid var(--off); background: var(--card); display:inline-flex; align-items:center; justify-content:center; color: var(--card); }
.cbox.on { background: var(--text); border-color: var(--text); }

.menu { position:absolute; z-index:20; min-width:200px; background:var(--menu); border:1px solid var(--border); border-radius:16px; box-shadow:var(--menu-shadow); padding:6px; transform-origin: top right; animation: unfold .15s ease-out; }
@keyframes unfold { from { transform: scaleY(.8); opacity:0; } to { transform:none; opacity:1; } }
.menu .mi { display:flex; align-items:center; gap:10px; width:100%; height:36px; padding:0 10px; border:0; background:transparent; border-radius:10px; text-align:left; font-size:14px; }
.menu .mi:hover { background: var(--hover); }
.menu .mi.danger { color: var(--cinnabar); }
.menu .msep { height:1px; background: var(--border); margin:4px 6px; }
.menu .mh { font-size:12px; color: var(--faint); padding:6px 10px 2px; }
.menu .ck { margin-left:auto; display:inline-flex; }
.batch { position:absolute; left:50%; bottom:24px; transform: translateX(-50%); display:flex; align-items:center; gap:2px; height:44px; padding:0 6px 0 16px; background: var(--menu); border:1px solid var(--border); border-radius:22px; box-shadow: var(--menu-shadow); white-space:nowrap; animation: rise .2s ease-out; font-size:13px; }
.batch button { border:0; background:transparent; height:32px; padding:0 12px; border-radius:16px; display:inline-flex; align-items:center; gap:6px; }
.batch button:hover { background: var(--hover); }
.batch .div { width:1px; height:18px; background: var(--border); margin:0 4px; }
@keyframes rise { from { transform: translate(-50%, 8px); opacity:0; } }

.empty { display:flex; flex-direction:column; align-items:center; padding: 64px 24px; }
.empty .ico { width:48px; height:48px; border-radius:24px; background: var(--soft); display:flex; align-items:center; justify-content:center; color: var(--muted); }
.tpls { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:12px; width:100%; max-width:768px; margin-top:28px; }
.tpl { display:flex; gap:12px; align-items:flex-start; padding:14px; border:1px solid var(--border); border-radius:16px; background: var(--card); text-align:left; }
.tpl:hover { background: var(--hover); }

/* 详情 */
.dhead { display:flex; align-items:center; gap:12px; height:72px; flex:none; padding:0 20px; border-bottom:1px solid var(--border); min-width:0; }
.dhead .tt { display:flex; flex-direction:column; min-width:0; flex:1; }
.dhead .tt b { font-size:16px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dhead .tt span { font-size:12.5px; color: var(--faint); }
.banner { display:flex; align-items:center; gap:8px; padding:10px 20px; font-size:13px; background: var(--warn-soft); border-bottom:1px solid var(--border); }
.banner a { font-weight:500; }
.detail { display:grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap:56px; max-width: 1180px; padding: 28px 40px 64px; }
.col { display:flex; flex-direction:column; gap:24px; min-width:0; }
.field { display:flex; flex-direction:column; gap:8px; }
.props { display:grid; grid-template-columns: 1fr 1fr; gap: 20px 16px; }
.pv { display:flex; align-items:center; gap:8px; min-width:0; }
.pv > span:last-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sh { display:flex; align-items:center; justify-content:space-between; min-height:28px; }
.link-btn { border:0; background:transparent; padding:0 4px; display:inline-flex; align-items:center; gap:4px; color: var(--muted); font-size:13px; height:28px; border-radius:8px; }
.link-btn:hover { color: var(--text); background: var(--hover); }
.trig { display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:14px; background: var(--soft); }
.trig .body { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.trig .tools { display:flex; gap:2px; }
.url { display:flex; align-items:center; gap:4px; margin-top:6px; height:34px; padding:0 3px 0 10px; border:1px solid var(--input-border); border-radius:10px; background: var(--card); min-width:0; }
.url code { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; font-family: var(--mono); }
.prompt { white-space:pre-wrap; line-height:1.75; }
.prompt.clamp { max-height: 8.75em; overflow:hidden; -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); }
.list { display:flex; flex-direction:column; gap:4px; }
.row { display:flex; align-items:center; gap:10px; height:44px; padding:0 14px; border:0; border-radius:12px; background: var(--soft); text-align:left; width:100%; min-width:0; font-size:14px; transition: background .15s; }
button.row:hover { background: var(--active); }
.row .t { width:108px; flex:none; font-variant-numeric: tabular-nums; }
.row .m { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color: var(--muted); font-size:13px; }
.row .s { flex:none; color: var(--faint); font-size:12.5px; }
.row .g { color: var(--faint); flex:none; display:inline-flex; }
.row.group { background: transparent; border: 1px dashed var(--input-border); }

/* 运行对话（同 9.3 知识库作业） */
.run-body { flex:1; min-height:0; display:flex; }
.conv { flex:1; min-width:0; display:flex; flex-direction:column; border-right:1px solid var(--border); }
.agentbar { height:52px; flex:none; display:flex; align-items:center; gap:8px; padding:0 24px; border-bottom:1px solid var(--border); }
.msgs { flex:1; min-height:0; overflow:auto; }
.msgs-in { max-width: 820px; margin: 0 auto; padding: 24px 28px; display:flex; flex-direction:column; gap:16px; }
.trigger { display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border:1px solid var(--border); border-radius:14px; font-size:13px; }
.bubble { align-self:flex-end; max-width:80%; padding:10px 14px; border-radius:18px; background: var(--fill); white-space:pre-wrap; animation: fade .3s ease-out; }
.amsg { display:flex; gap:10px; animation: fade .3s ease-out; }
.amsg .tx { flex:1; min-width:0; font-size:14px; line-height:1.8; display:flex; flex-direction:column; gap:6px; }
.steps { border:0; background:transparent; padding:0; color: var(--faint); font-size:12.5px; display:inline-flex; align-items:center; gap:6px; align-self:flex-start; }
.steps:hover { color: var(--text); }
.steplist { border-left:2px solid var(--border); padding-left:12px; display:flex; flex-direction:column; gap:2px; font-size:12.5px; color: var(--muted); }
.foot { font-size:12px; color: var(--faint); display:inline-flex; gap:10px; }
@keyframes fade { from { opacity:0; transform: translateY(4px); } }
.breathe { animation: breathe 1.8s ease-in-out infinite; }
@keyframes breathe { 50% { opacity:.35; } }
.shimmer { background: linear-gradient(90deg, var(--faint) 30%, var(--text) 50%, var(--faint) 70%); background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation: shim 3s linear infinite; }
@keyframes shim { to { background-position: -200% 0; } }
.queue { margin: 0 28px -4px; padding:8px 12px; border-radius:12px; background: var(--fill); font-size:12.5px; display:flex; flex-direction:column; gap:2px; }
.composer { padding:12px 28px 20px; flex:none; }
.composer-box { display:flex; align-items:center; gap:6px; padding:6px 8px 6px 6px; border:1px solid var(--composer-border); border-radius:26px; background: var(--card); box-shadow: var(--composer-shadow); }
.composer-box textarea { flex:1; min-width:0; border:0; outline:0; resize:none; background:none; font:inherit; font-size:14px; line-height:1.7; padding:8px 4px; color:inherit; max-height:160px; }
.act { width:36px; height:36px; border-radius:18px; border:0; background: var(--text); color: var(--card); display:inline-flex; align-items:center; justify-content:center; }
.act.off { background: var(--chip); color: var(--faint); cursor:not-allowed; }
.act .sq { width:11px; height:11px; border-radius:2px; background: currentColor; }
.side-panel { width:340px; flex:none; background: var(--panel); overflow:auto; padding:20px 24px; display:flex; flex-direction:column; gap:20px; }
.kv { display:grid; grid-template-columns: 72px minmax(0,1fr); gap:10px 12px; font-size:13.5px; margin:0; }

<script>
const sv = (d, s = 16, w = 1.8) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;

const ic = (k, s, w, color) => color ? `<span style="color:${color};display:inline-flex">${sv(P[k], s, w)}</span>` : sv(P[k], s, w);

// 示例数据（虚构）
const A = { dev:['通','通用开发助手'], content:['内','内容智能体'], code:['编','编码智能体'], research:['研','研究智能体'], lin:['林','林晓'], zhou:['周','周宁'] };
const av = (k, bot, cls = '') => `<span class="av ${bot ? 'bot' : ''} ${cls}">${A[k][0]}${bot ? '<span class="st"></span>' : ''}</span>`;
const autopilots = [
  { id:'a1', name:'新任务自动分诊', desc:'读取新建任务的描述和附件，按影响面评估严重程度，设置优先级并留评论说明理由。', as:'dev', bot:true, trig:['webhook'], status:'active', last:['completed','12 分钟前'], next:null, mode:'仅运行', creator:'lin', created:'10/12' },
  { id:'a2', name:'每日站会纪要', desc:'汇总昨天到今天的任务变化和对话，按人整理成站会纪要，创建任务并 @ 订阅者。', as:'content', bot:true, trig:['schedule'], status:'active', last:['issue_created','2 小时前'], next:'10月28日 09:30', mode:'创建任务', creator:'lin', created:'10/08' },

  { id:'a4', name:'周报生成', desc:'汇总过去 7 天已完成、进行中和阻塞的任务，计算关闭数、新增数和净变化，写成周报。', as:'research', bot:true, trig:['schedule'], status:'active', last:['completed','6 天前'], next:'10月31日 18:00', mode:'创建任务', creator:'zhou', created:'09/21' },
  { id:'a5', name:'依赖升级检查', desc:'运行依赖审计工具，列出有已知漏洞的包和落后两个大版本以上的包，给出修复建议。', as:'code', bot:true, trig:['schedule'], status:'paused', runtime:true, last:['skipped','13 天前'], next:null, mode:'仅运行', creator:'lin', created:'09/12' },

];

const state = {
  view:'list', scope:'all', selected:new Set(), filter:false,
  cols:{ assignee:true, trigger:true, lastRun:true, nextRun:true, mode:false, creator:false, created:false },
  sort:'lastRun', dir:'desc', active:true, promptOpen:false, skippedOpen:false, aside:false,
  msgs:[], busy:false, queued:[], live:false, liveTimer:null,
};
const $main = document.getElementById('main');
const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };
const esc = (s) => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m) { const t = el(`<div class="toast" role="status">${m}</div>`); document.body.appendChild(t); setTimeout(() => t.remove(), 1800); }
// 便签不压在画面上：收集到右下角的「改动说明」面板
let pendingNotes = [];
const note = (_pos, t, b) => { pendingNotes.push(`<div class="note"><b>${t}</b>${b}</div>`); return ''; };
function flushNotes() {
  document.getElementById('notes-list').innerHTML = pendingNotes.join('');
  document.getElementById('notes-toggle').textContent = `改动说明 ${pendingNotes.length}`;
  pendingNotes = [];
}

function go(v) {
  state.view = v;
  if (v === 'run' || v === 'run-live') { state.live = v === 'run-live'; state.busy = state.live; state.msgs = []; state.queued = []; }
  try { history.replaceState(null, '', '#' + v); } catch (e) {}
  document.querySelectorAll('[data-go]').forEach(b => b.setAttribute('aria-pressed', b.dataset.go === v));
  render();
}
function render() {
  document.querySelectorAll('.menu').forEach(m => m.remove());
  if (state.view === 'list' || state.view === 'empty') renderList(state.view === 'empty');
  else if (state.view === 'detail') renderDetail();
  else renderRun();
  flushNotes();
}

/* ========== ① 列表 ========== */
function rowsInScope() { return autopilots.filter(a => state.scope === 'all' || a.status === state.scope); }
function visibleRows() {
  let r = rowsInScope();
  if (state.filter) r = r.filter(a => a.trig.includes('schedule'));
  return r;
}
function meta(a) {
  const p = [];
  if (state.cols.assignee) p.push(`<span>${av(a.as, a.bot)}${A[a.as][1]}</span>`);
  if (state.cols.trigger) p.push(`<span>${a.trig.map(k => ic(k, 13)+(k === 'schedule' ? '时间表' : 'Webhook')).join('<span class="sep" style="padding:0 2px"></span>')}</span>`);
  if (state.cols.lastRun) p.push(a.last ? `<span class="tab"><span class="dot" style="background:${RUN[a.last[0]][1]}" title="${RUN[a.last[0]][0]}"></span>${a.last[1]}</span>` : `<span class="faint">未运行</span>`);
  if (state.cols.nextRun && a.next) p.push(`<span class="tab">下次 ${a.next}</span>`);
  if (state.cols.mode) p.push(`<span>${a.mode}</span>`);
  if (state.cols.creator) p.push(`<span>${av(a.creator, false)}${A[a.creator][1]}</span>`);
  if (state.cols.created) p.push(`<span class="tab">${a.created} 创建</span>`);
  return p.join('<span class="sep">·</span>');
}
function renderList(empty) {
  const counts = { all: autopilots.length, active: autopilots.filter(a => a.status === 'active').length, paused: autopilots.filter(a => a.status === 'paused').length };
  const rows = visibleRows();
  $main.innerHTML = `
  <header class="head">
    <span class="muted" style="display:inline-flex">${sv(P.bolt, 20)}</span>
    <h1>自动化</h1>${empty ? '' : `<span class="count">${autopilots.length}</span>`}
    <span style="flex:1"></span>
    <button class="btn-p" data-create>${sv(P.plus)}新建自动化</button>
  </header>
  <div class="tabs" role="tablist" aria-label="自动化">
    <button role="tab" aria-selected="true">自动化</button>
    <button role="tab" aria-selected="false" data-wakeups>任务唤醒</button>
  </div>
  ${empty ? `
  <div class="scroll"><div class="empty">
    <span class="ico">${sv(P.bolt, 24)}</span>
    <p style="margin:14px 0 0;font-size:16px;font-weight:600">还没有自动化</p>
    <p class="muted" style="margin:6px 0 0;font-size:13px">为你的智能体安排周期性工作。从模板选一个，或从空白开始。</p>
    <div class="tpls">
      ${[['news','每日新闻摘要','每天搜集当日行业新闻，汇总成摘要发到任务评论'],['pr','PR 评审提醒','工作日找出超过 24 小时未评审的 PR 并提醒'],['bug','缺陷分级','评估未定优先级缺陷的严重程度并设置优先级'],['chart','每周进度报告','汇总本周完成、进行中和阻塞的任务'],['shield','依赖安全审计','检查有漏洞或严重落后的依赖'],['doc','文档缺口检查','找出近一周缺少文档的代码改动']].map(([k,t,s]) => `<button class="tpl">${ic(k,20,1.8,'var(--muted)')}<span style="display:flex;flex-direction:column;gap:4px;min-width:0"><span style="font-weight:500">${t}</span><span class="muted" style="font-size:13px;line-height:1.5">${s}</span></span></button>`).join('')}
    </div>
    <button class="btn-o" style="margin-top:20px;height:32px;font-size:13px">${sv(P.plus, 14)}从空白开始</button>
  </div></div>
  ${note('top:140px;right:24px','空状态','与初版一致：模板卡片 + 「从空白开始」。只把模板卡片圆角统一成 16px。')}` : `
  <div class="toolbar">
    <div>
      <div class="seg" role="group" aria-label="范围">

    <div>
      ${state.filter
        ? `<button class="pill on" data-menu="filter">${sv(P.filter, 14)}触发器：时间表<span role="button" aria-label="清除筛选" data-clearfilter style="display:flex;width:18px;height:18px;border-radius:9px;background:rgba(255,255,255,.18);align-items:center;justify-content:center">${sv(P.x, 11, 2.2)}</span></button>`
        : `<button class="pill" data-menu="filter">${sv(P.filter, 14)}筛选</button>`}
      <button class="pill" data-menu="display">${sv(state.dir === 'desc' ? P.down : P.up, 14)}${{name:'名称',lastRun:'上次运行',nextRun:'下次运行',created:'创建时间'}[state.sort]}</button>
    </div>
  </div>
  <div class="scroll">
    ${rows.length ? `<div class="cards">
      ${rows.map(a => `

function menuHtml(kind) {
  const mi = (attr, label, on, extra = '') => `<button class="mi" ${attr} ${extra}>${label}${on ? `<span class="ck">${sv(P.check, 14, 2)}</span>` : ''}</button>`;
  if (kind === 'filter') {
    const sec = (h, items, key) => `<div class="mh">${h}</div>` + items.map(x => mi(`data-f="${key}"`, x, key === 'trig' && x === '时间表' && state.filter)).join('');
    return sec('执行者', ['通用开发助手','内容智能体','编码智能体','研究智能体','林晓'], 'as') + '<div class="msep"></div>' + sec('模式', ['创建任务','仅运行'], 'mode') + '<div class="msep"></div>' + sec('触发器', ['时间表','Webhook'], 'trig') + '<div class="msep"></div>' + sec('创建者', ['林晓','周宁'], 'creator');
  }
  if (kind === 'display') {
    return `<div class="mh">排序</div>` + [['name','名称'],['lastRun','上次运行'],['nextRun','下次运行'],['created','创建时间']].map(([k,l]) => mi(`data-sort="${k}"`, l, state.sort === k)).join('') +
      '<div class="msep"></div>' + mi('data-dir="asc"', '升序', state.dir === 'asc') + mi('data-dir="desc"', '降序', state.dir === 'desc') +
      '<div class="msep"></div><div class="mh">显示字段</div>' + [['assignee','执行者'],['trigger','触发器'],['lastRun','上次运行'],['nextRun','下次运行'],['mode','模式'],['creator','创建者'],['created','创建时间']].map(([k,l]) => mi(`data-col="${k}"`, l, state.cols[k])).join('');
  }
  const a = autopilots.find(x => x.id === kind.split(':')[1]);
  return `<button class="mi" data-act="已在新标签页打开">${sv(P.open, 15)}在新标签页打开</button><div class="msep"></div>` +
    (a.status === 'active' ? `<button class="mi" data-act="已暂停">${sv(P.pause, 15)}暂停</button>` : `<button class="mi" data-act="已启用">${sv(P.play, 15)}启用</button>`) +
    `<button class="mi danger" data-act="打开删除确认">${sv(P.trash, 15)}删除</button>`;
}
function openMenu(btn, kind) {

function flush() { if (state.queued.length) { const q = state.queued.shift(); setTimeout(() => send(q), 300); } }

document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
document.getElementById('notes-toggle').onclick = (e) => { const l = document.getElementById('notes-list'); l.hidden = !l.hidden; e.currentTarget.setAttribute('aria-expanded', String(!l.hidden)); };
// 等比缩放画板以适配屏幕宽度（手机上看到的也是 PC 版式）
let scale = 1;
function fit() {
  const wrap = document.getElementById('stage-wrap'), clip = document.getElementById('stage-clip');
  const cs = getComputedStyle(wrap);
  const avail = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  scale = Math.min(1, avail / 1440);
  document.getElementById('stage').style.transform = `scale(${scale})`;
  clip.style.width = (1440 * scale) + 'px';
  clip.style.height = (900 * scale) + 'px';
}
fit();
window.addEventListener('resize', fit);

const VIEWS = ['list','empty','detail','run','run-live'];
const h0 = location.hash.slice(1);
go(VIEWS.includes(h0) ? h0 : 'list');
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (VIEWS.includes(h) && h !== state.view) go(h); });
</script>
