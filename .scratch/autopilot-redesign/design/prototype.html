<title>自动化改版原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 布局：Marvis 外壳（侧栏 + 白色主画布），主画布内三屏：列表 / 详情 / 运行对话 */
:root {
  --shell: #f7f7f7;
  --canvas: #ffffff;
  --fg: #0f0f0f;
  --muted: #666666;
  --faint: #888888;
  --line: rgba(0,0,0,.08);
  --hover: #f2f2f2;
  --selected: #ebebeb;
  --sunken: #f4f4f4;
  --field: #f3f3f3;
  --brand: #7b4835;
  --ok: #3f8f6b;      /* 石绿 */
  --err: #c2412d;     /* 朱砂 */
  --warn: #b98a12;    /* 藤黄 */
  --info: #2f6f9f;    /* 花青 */
  --note-bg: #fff8e6;
  --note-line: #f0d48a;
  --primary-fg: #ffffff;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.06);
  --font: "PingFang SC","Noto Sans SC",-apple-system,system-ui,sans-serif;
  --mono: ui-monospace,"SF Mono",Menlo,monospace;
  --speed: 1;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --shell:#161616; --canvas:#1d1d1d; --fg:#ececec; --muted:#a3a3a3; --faint:#8a8a8a; --line:rgba(255,255,255,.09);
  --hover:#262626; --selected:#2e2e2e; --sunken:#232323; --field:#262626; --brand:#c9876c;
  --ok:#5cb38d; --err:#e06a55; --warn:#d6ab3a; --info:#6aa5d4; --note-bg:#2a2414; --note-line:#5a4a1e; --primary-fg:#0f0f0f; color-scheme:dark; } }
:root[data-theme="dark"] {
  --shell:#161616; --canvas:#1d1d1d; --fg:#ececec; --muted:#a3a3a3; --faint:#8a8a8a; --line:rgba(255,255,255,.09);
  --hover:#262626; --selected:#2e2e2e; --sunken:#232323; --field:#262626; --brand:#c9876c;
  --ok:#5cb38d; --err:#e06a55; --warn:#d6ab3a; --info:#6aa5d4; --note-bg:#2a2414; --note-line:#5a4a1e; --primary-fg:#0f0f0f; color-scheme:dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--shell); color: var(--fg); font: 14px/1.55 var(--font); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
.mono { font-family: var(--mono); }
.tab { font-variant-numeric: tabular-nums; }

/* 原型切换条（不属于产品界面） */
.proto-bar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding-block:10px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); font-size:12px; color:var(--muted); }
.proto-bar b { color: var(--fg); margin-right: 4px; }
.proto-bar button { border:1px solid var(--line); background:var(--canvas); border-radius:999px; padding:3px 10px; }
.proto-bar button[aria-pressed="true"] { background:var(--fg); color:var(--primary-fg); border-color:var(--fg); }

.app { display:flex; height: calc(100% - 46px); min-height: 640px; padding: 0 8px 8px max(8px, env(safe-area-inset-left,0px)); padding-right: max(8px, env(safe-area-inset-right,0px)); gap: 0; }
.side { width: 216px; flex: none; padding: 8px 8px; display:flex; flex-direction:column; gap:2px; }
.logo { display:flex; align-items:center; gap:8px; height:40px; padding:0 8px; font-weight:600; }
.logo i { width:22px; height:22px; border-radius:6px; background:var(--fg); color:var(--primary-fg); display:inline-flex; align-items:center; justify-content:center; font-style:normal; font-size:12px; }
.nav { display:flex; align-items:center; gap:10px; height:36px; padding:0 10px; border-radius:8px; color:var(--muted); }
.nav.on { background: var(--selected); color: var(--fg); font-weight:500; }
.main { flex:1; min-width:0; background:var(--canvas); border-radius:12px; box-shadow: var(--shadow); display:flex; flex-direction:column; overflow:hidden; position:relative; }
@media (max-width: 760px) { .side { display:none; } .app { padding: 0 0 0 0; } .main { border-radius: 0; } }

/* 通用控件 */
.btn { display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 14px; border-radius:999px; border:1px solid var(--line); background:var(--canvas); white-space:nowrap; transition: background .15s; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--fg); color: var(--primary-fg); border-color: var(--fg); }
.btn.primary:hover { opacity:.88; }
.btn[disabled] { opacity:.45; cursor:not-allowed; }
.ibtn { width:32px; height:32px; border-radius:999px; border:0; background:transparent; display:inline-flex; align-items:center; justify-content:center; color:var(--muted); transition: background .15s; }
.ibtn:hover { background: var(--hover); color: var(--fg); }
.ibtn.sm { width:26px; height:26px; }
svg { flex:none; }
.seg { display:inline-flex; gap:2px; padding:2px; border-radius:999px; background: var(--sunken); }
.seg button { border:0; background:transparent; height:28px; padding:0 12px; border-radius:999px; color:var(--muted); }
.seg button[aria-pressed="true"] { background: var(--canvas); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight:500; }
.count { color: var(--faint); margin-left:4px; font-size:12px; }
.switch { width:34px; height:20px; border-radius:999px; background: var(--selected); border:0; position:relative; padding:0; transition: background .2s; }
.switch::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.2); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--ok); }
.switch[aria-checked="true"]::after { transform: translateX(14px); }
.dot { width:6px; height:6px; border-radius:50%; display:inline-block; flex:none; }
.av { width:20px; height:20px; border-radius:50%; background: var(--selected); display:inline-flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; flex:none; }
.av.agent { border-radius:6px; }
.chip { display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 9px; border-radius:999px; border:1px solid var(--line); font-size:12px; }
.label { font-size:12px; color: var(--faint); margin-bottom:6px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.sep { color: var(--faint); padding: 0 6px; }

/* 便签：标注改动点 */
.note { position:absolute; z-index:5; max-width:240px; background: var(--note-bg); border:1px solid var(--note-line); border-radius:8px; padding:8px 10px; font-size:12px; line-height:1.5; color: var(--fg); box-shadow: var(--shadow); }
.note b { display:block; margin-bottom:2px; }
body.no-notes .note { display:none; }

/* ===== 列表 ===== */
.scroll { flex:1; min-height:0; overflow:auto; }
.list-wrap { max-width: 1040px; margin: 0 auto; padding: 40px max(16px, 4vw) 96px; }
.page-title { font-size:26px; font-weight:600; letter-spacing:.01em; margin:0 0 20px; }
.toolbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
.toolbar .grow { flex:1; }
.cards { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:12px; }
@media (max-width: 900px) { .cards { grid-template-columns: minmax(0,1fr); } }
.card { position:relative; border:1px solid var(--line); border-radius:14px; padding:16px 18px; background: var(--canvas); text-align:left; display:flex; flex-direction:column; gap:6px; min-width:0; transition: background .15s, border-color .15s; cursor:pointer; }
.card:hover { background: var(--hover); }
.card.sel { background: var(--selected); border-color: transparent; }
.card-title { display:flex; align-items:center; gap:8px; font-weight:500; min-width:0; padding-right: 56px; }
.card-title span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.card-desc { color: var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height: 2.9em; }
.card-meta { display:flex; align-items:center; flex-wrap:wrap; row-gap:4px; font-size:12.5px; color: var(--muted); }
.card-meta > span { display:inline-flex; align-items:center; gap:5px; }
.card-tools { position:absolute; top:10px; right:10px; display:flex; gap:2px; opacity:0; transition: opacity .15s; }
.card:hover .card-tools, .card.sel .card-tools, .card-tools.open { opacity:1; }
.cbox { width:16px; height:16px; border-radius:4px; border:1.5px solid var(--faint); background: var(--canvas); display:inline-flex; align-items:center; justify-content:center; }
.cbox.on { background: var(--fg); border-color: var(--fg); color: var(--primary-fg); }
.menu { position:absolute; z-index:20; min-width:200px; background: var(--canvas); border:1px solid var(--line); border-radius:12px; box-shadow: 0 8px 28px rgba(0,0,0,.14); padding:4px; transform-origin: top right; animation: unfold .15s ease-out; }
@keyframes unfold { from { transform: scaleY(.8); opacity:0; } to { transform:none; opacity:1; } }
.menu .mi { display:flex; align-items:center; gap:10px; width:100%; height:36px; padding:0 10px; border:0; background:transparent; border-radius:8px; text-align:left; }
.menu .mi:hover { background: var(--hover); }
.menu .mi.danger { color: var(--err); }
.menu .msep { height:1px; background: var(--line); margin:4px 6px; }
.menu .mh { font-size:12px; color: var(--faint); padding:6px 10px 2px; }
.menu .mi .ck { margin-left:auto; color: var(--fg); }
.batch { position:absolute; left:50%; bottom:20px; transform: translateX(-50%); display:flex; align-items:center; gap:4px; background: var(--fg); color: var(--primary-fg); border-radius:999px; padding:4px 6px 4px 14px; box-shadow: 0 8px 24px rgba(0,0,0,.2); white-space:nowrap; animation: rise .2s ease-out; }
.batch button { border:0; background:transparent; color:inherit; height:30px; padding:0 10px; border-radius:999px; }
.batch button:hover { background: rgba(127,127,127,.25); }
@keyframes rise { from { transform: translate(-50%, 8px); opacity:0; } }
.empty { text-align:center; padding: 40px 0; }
.tpls { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:10px; margin: 24px auto 16px; max-width: 760px; text-align:left; }
@media (max-width: 900px) { .tpls { grid-template-columns: minmax(0,1fr); } }
.tpl { border:1px solid var(--line); border-radius:14px; padding:14px; background:var(--canvas); text-align:left; }
.tpl:hover { background: var(--hover); }

/* ===== 详情 ===== */
.topbar { display:flex; align-items:center; gap:8px; height:52px; padding: 0 12px 0 20px; border-bottom: 1px solid var(--line); flex:none; min-width:0; }
.crumb { display:flex; align-items:center; gap:8px; min-width:0; flex:1; }
.crumb a { color: var(--muted); text-decoration:none; white-space:nowrap; }
.crumb a:hover { color: var(--fg); }
.crumb strong { font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.banner { display:flex; align-items:center; gap:8px; padding: 8px 20px; font-size:12.5px; background: color-mix(in oklab, var(--warn) 12%, var(--canvas)); color: var(--fg); border-bottom: 1px solid var(--line); }
.banner a { color: inherit; font-weight:500; }
.detail { display:grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 48px; max-width: 1180px; margin: 0 auto; padding: 32px max(16px, 3vw) 64px; }
@media (max-width: 980px) { .detail { grid-template-columns: minmax(0,1fr); gap: 32px; } }
.field { display:flex; flex-direction:column; gap:2px; }
.col { display:flex; flex-direction:column; gap:22px; min-width:0; }
.props { display:grid; grid-template-columns: 1fr 1fr; gap: 18px 16px; }
.pv { display:flex; align-items:center; gap:8px; min-width:0; }
.pv span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.section-h { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.section-h h3 { margin:0; font-size:12px; font-weight:400; color: var(--faint); }
.trig { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border-radius:10px; background: var(--sunken); }
.trig + .trig { margin-top:6px; }
.trig .t-body { flex:1; min-width:0; }
.trig .t-tools { display:flex; gap:2px; opacity:.55; transition: opacity .15s; }
.trig:hover .t-tools { opacity:1; }
.url { display:flex; align-items:center; gap:6px; margin-top:6px; background: var(--canvas); border:1px solid var(--line); border-radius:8px; padding:4px 4px 4px 10px; min-width:0; }
.url code { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
.prompt { position:relative; color: var(--fg); white-space:pre-wrap; }
.prompt.clamp { max-height: 7.8em; overflow:hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
.more { border:0; background:transparent; padding:4px 0; color: var(--muted); display:inline-flex; align-items:center; gap:4px; }
.more:hover { color: var(--fg); }
.runs { display:flex; flex-direction:column; gap:4px; }
.run { display:flex; align-items:center; gap:10px; height:42px; padding: 0 12px; border-radius:10px; background: var(--sunken); border:0; text-align:left; width:100%; transition: background .15s; min-width:0; }
.run:hover { background: var(--selected); }
.run .r-time { width: 96px; flex:none; font-weight:500; }
.run .r-mid { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color: var(--muted); font-size:12.5px; }
.run .r-src { flex:none; font-size:12px; color: var(--faint); }
.run .r-go { color: var(--faint); flex:none; }
.run.skipgrp { background: transparent; border: 1px dashed var(--line); }
.danger-link { color: var(--err); }
.subs { display:flex; flex-wrap:wrap; gap:6px; }

/* ===== 运行对话 ===== */
.run-page { flex:1; min-height:0; display:flex; }
.thread { flex:1; min-width:0; display:flex; flex-direction:column; }
.msgs { flex:1; min-height:0; overflow:auto; }
.msgs-inner { max-width: 760px; margin: 0 auto; padding: 28px max(16px, 3vw) 24px; display:flex; flex-direction:column; gap:18px; }
.trigger-card { display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:13px; }
.trigger-card .tc-body { flex:1; min-width:0; }
.u-msg { align-self:flex-end; max-width: 80%; background: var(--sunken); border-radius:16px; padding:10px 14px; white-space:pre-wrap; animation: fade .3s ease-out; }
.a-msg { display:flex; flex-direction:column; gap:8px; animation: fade .3s ease-out; }
.a-head { display:flex; align-items:center; gap:8px; font-size:13px; color: var(--muted); }
.steps { color: var(--faint); font-size:13px; display:flex; align-items:center; gap:4px; border:0; background:transparent; padding:0; }
.steps:hover { color: var(--fg); }
.tool-list { border-left: 2px solid var(--line); padding-left: 12px; margin-left: 2px; display:flex; flex-direction:column; gap:4px; font-size:12.5px; color: var(--muted); }
.a-actions { display:flex; gap:2px; color: var(--faint); align-items:center; font-size:12px; }
@keyframes fade { from { opacity:0; transform: translateY(4px); } }
.breathe { animation: breathe 1.8s ease-in-out infinite; }
@keyframes breathe { 50% { opacity:.35; } }
.shimmer { background: linear-gradient(90deg, var(--faint) 30%, var(--fg) 50%, var(--faint) 70%); background-size: 200% 100%; -webkit-background-clip:text; background-clip:text; color: transparent; animation: shim 3s linear infinite; }
@keyframes shim { to { background-position: -200% 0; } }
.composer { flex:none; padding: 8px max(16px, 3vw) 16px; }
.composer-inner { max-width: 760px; margin: 0 auto; }
.queue { display:flex; align-items:center; gap:8px; font-size:12.5px; color: var(--muted); padding: 6px 12px; border:1px solid var(--line); border-bottom:0; border-radius: 12px 12px 0 0; margin: 0 12px; }
.input { display:flex; align-items:flex-end; gap:8px; border:1px solid var(--line); border-radius:16px; padding:8px 8px 8px 12px; background: var(--canvas); box-shadow: var(--shadow); }
.input textarea { flex:1; min-width:0; border:0; outline:0; resize:none; background:transparent; font: inherit; color: inherit; min-height: 24px; max-height: 160px; padding: 4px 0; }
.input .send { width:32px; height:32px; border-radius:50%; border:0; background: var(--fg); color: var(--primary-fg); display:inline-flex; align-items:center; justify-content:center; }
.input .send[disabled] { opacity:.3; cursor:not-allowed; }
.input-foot { display:flex; justify-content:space-between; font-size:12px; color: var(--faint); padding: 6px 4px 0; }
.offline { display:flex; align-items:center; gap:8px; font-size:12.5px; padding:8px 12px; border-radius:10px; background: color-mix(in oklab, var(--warn) 12%, var(--canvas)); margin-bottom: 8px; }
.aside { width: 288px; flex:none; border-left: 1px solid var(--line); overflow:auto; padding: 16px; display:flex; flex-direction:column; gap: 12px; }
@media (max-width: 1100px) { .aside { display:none; } .aside.force { display:flex; position:absolute; right:0; top:52px; bottom:0; background: var(--canvas); z-index: 6; box-shadow: var(--shadow); } }
.panel { border:1px solid var(--line); border-radius:12px; padding: 12px 14px; display:flex; flex-direction:column; gap:10px; }
.panel h4 { margin:0; font-size:12px; font-weight:400; color: var(--faint); display:flex; justify-content:space-between; align-items:center; }
.kv { display:grid; grid-template-columns: 72px minmax(0,1fr); gap:8px 10px; font-size:13px; }
.kv dt { color: var(--faint); }
.kv dd { margin:0; min-width:0; overflow-wrap:anywhere; }
pre.payload { margin:0; font: 12px/1.5 var(--mono); background: var(--sunken); border-radius:8px; padding:8px 10px; overflow:auto; max-height: 200px; }
.status-pill { display:inline-flex; align-items:center; gap:6px; font-size:12px; padding: 2px 9px; border-radius:999px; border:1px solid var(--line); }
.toast { position:fixed; top: calc(14px + env(safe-area-inset-top,0px)); left:50%; transform: translateX(-50%); background: var(--fg); color: var(--primary-fg); padding: 8px 14px; border-radius:10px; font-size:13px; box-shadow: var(--shadow); z-index: 50; animation: toast .3s cubic-bezier(.22,.57,.02,1.2); }
@keyframes toast { from { transform: translate(-50%, -120%); } }
.modal-back { position:absolute; inset:0; background: rgba(15,15,15,.2); display:flex; align-items:center; justify-content:center; z-index: 30; animation: fade .12s; padding: 16px; }
.modal { background: var(--canvas); border-radius: 20px; padding: 20px; width: 420px; max-width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,.2); }
.modal h5 { margin: 0 0 6px; font-size: 16px; }
.modal .row { display:flex; justify-content:flex-end; gap:8px; margin-top: 18px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

function bindList() {
  $main.querySelectorAll('[data-scope]').forEach(b => b.onclick = () => { state.scope = b.dataset.scope; render(); });

  $main.querySelectorAll('[data-toggle]').forEach(b => b.onclick = (e) => { e.stopPropagation(); const id = b.dataset.toggle; state.selected.has(id) ? state.selected.delete(id) : state.selected.add(id); render(); });

  $main.querySelectorAll('[data-menu]').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    document.querySelectorAll('.menu').forEach(m => m.remove());
    const kind = b.dataset.menu; state.menu = kind;

    const m = el(`<div class="menu" role="menu">${menuHtml(kind)}</div>`);

    m.querySelectorAll('[data-dir]').forEach(x => x.onclick = () => { state.dir = state.dir === 'desc' ? 'asc' : 'desc'; render(); });
    m.querySelectorAll('[data-col]').forEach(x => x.onclick = () => { state.cols[x.dataset.col] = !state.cols[x.dataset.col]; render(); });
    m.querySelectorAll('.mi:not([data-sort]):not([data-dir]):not([data-col])').forEach(x => x.onclick = () => { toast(x.textContent.trim()); m.remove(); state.menu = null; });
  });
}

            <div class="url"><code>https://api.marvis.ai/autopilots/hooks/9f2c…e1a7</code><button class="ibtn sm" aria-label="复制">${I.copy}</button><button class="ibtn sm" aria-label="重置地址">${I.rotate}</button><button class="ibtn sm" aria-label="删除触发器">${I.trash}</button></div>
          </div>
        </div>
      </div>
      <div>
        <div class="section-h"><h3>Webhook 投递</h3></div>
        <div class="runs">
          <div class="run" style="height:38px"><span class="dot" style="background:var(--ok)"></span><span class="r-mid" style="color:var(--fg)">pull_request.opened</span><span class="r-src tab">今天 09:41</span></div>
          <div class="run" style="height:38px"><span class="dot" style="background:var(--err)"></span><span class="r-mid" style="color:var(--fg)">pull_request.synchronize</span><span class="r-src tab">10月24日 10:00</span></div>
        </div>
      </div>
    </div>
    <div class="col">
      <div>
        <div class="label">指令</div>
        <div class="prompt ${state.promptOpen ? '' : 'clamp'}">${PROMPT}</div>
        <button class="more" data-prompt>${state.promptOpen ? '收起' : '显示全部'}${I.chev}</button>
      </div>
      <div>
        <div class="section-h"><h3>运行记录</h3></div>
        <div class="runs">
          ${RUNS.map((r, i) => `<button class="run" data-runrow="${i}">${runIcon(r.s)}<span class="r-time tab">${r.t}</span><span class="r-mid" ${r.s==='failed' ? 'style="color:var(--err)"' : ''}>${r.s === 'running' ? '<span class="shimmer">运行中…</span>' : r.mid}</span><span class="r-src">${r.src}</span><span class="r-go">${I.right}</span></button>`).join('')}
          <button class="run skipgrp" data-skip>${state.skippedOpen ? I.chev : I.right}${I.ban}<span class="r-time">已跳过</span><span class="r-mid">2 条跳过的运行</span><span class="r-src tab">10月20日 10:00</span></button>
          ${state.skippedOpen ? `<button class="run" data-runrow="0">${I.ban}<span class="r-time tab">10月20日 10:00</span><span class="r-mid">assignee runtime offline</span><span class="r-src">时间表</span><span class="r-go">${I.right}</span></button><button class="run">${I.ban}<span class="r-time tab">10月19日 10:00</span><span class="r-mid">a recent run already covers this</span><span class="r-src">时间表</span><span class="r-go">${I.right}</span></button>` : ''}
        </div>
      </div>
    </div>
  </div></div>
  ${note('top:64px;right:200px', '顶栏', '编辑 / 删除收成图标按钮，「立即运行」保留为主按钮；删除从页面底部危险区移到顶栏，仍弹确认框。启停开关从标题旁移到左栏「状态」。')}
  ${note('top:420px;left:24px', '左栏：配置', '属性、订阅者（仅创建任务模式）、触发器（编辑 / 删除 / 复制 / 重置地址）、Webhook 投递，内容与现在一致，只换版式。')}
  ${note('top:300px;right:24px', '右栏：指令 + 运行记录', '指令默认折叠 5 行，可展开。每条运行可点：仅运行模式进入运行对话页；创建任务模式跳到任务详情。跳过的运行仍折叠成一组。')}
  `;
  $main.querySelector('[data-back]').onclick = (e) => { e.preventDefault(); go('list'); };
  $main.querySelector('[data-sw]').onclick = () => { state.active = !state.active; render(); };
  $main.querySelector('[data-prompt]').onclick = () => { state.promptOpen = !state.promptOpen; render(); };
  $main.querySelector('[data-skip]').onclick = () => { state.skippedOpen = !state.skippedOpen; render(); };
  $main.querySelector('[data-run]').onclick = () => toast('已触发自动化');
  $main.querySelector('[data-del]').onclick = () => confirmDel();
  $main.querySelectorAll('[data-runrow]').forEach(b => b.onclick = () => go(RUNS[+b.dataset.runrow].s === 'running' ? 'run-live' : 'run'));
}
function confirmDel() {
  const m = el(`<div class="modal-back"><div class="modal" role="alertdialog" aria-labelledby="dt"><h5 id="dt">删除自动化？</h5><div class="muted">「PR 积压提醒」及其触发器会被删除，无法恢复。</div><div class="row"><button class="btn" data-c>取消</button><button class="btn primary" style="background:var(--err);border-color:var(--err)" data-c>删除</button></div></div></div>`);
  $main.appendChild(m); m.querySelectorAll('[data-c]').forEach(b => b.onclick = () => m.remove());
}

/* ---------- 运行对话 ---------- */
const TRANSCRIPT_STEPS = ['已运行 gh pr list --state open', '已读取 3 个 PR 的评审状态', '已在任务 MAR-214 下发表评论'];
function agentBlock(text, steps, done) {
  return `<div class="a-msg">
    <div class="a-head"><span class="av agent">代</span>代码管家 ${done ? '' : '<span class="shimmer">正在执行</span>'}</div>
    ${steps.length ? `<button class="steps" data-steps>${I.right}已执行 ${steps.length} 步</button><div class="tool-list" hidden>${steps.map(s => `<div>${s}</div>`).join('')}</div>` : ''}
    <div>${text}</div>
    ${done ? `<div class="a-actions"><button class="ibtn sm" aria-label="复制">${I.copy}</button><span class="tab">10:02</span></div>` : ''}
  </div>`;
}
function renderRun() {
  const live = state.live;
  const first = live
    ? agentBlock('<span class="faint">正在读取打开的 PR 列表…</span>', TRANSCRIPT_STEPS.slice(0,1), false)
    : agentBlock(`发现 3 个超过 24 小时未评审的 PR：<ul style="margin:6px 0 0;padding-left:20px"><li>#812 修复看板拖拽错位 · 林夕 · 31 小时</li><li>#815 状态库支持分组 · 马云鹏 · 27 小时</li><li>#818 飞书登录回调 · 周岚 · 25 小时</li></ul>已在任务 <a href="#" style="color:var(--info)">MAR-214</a> 下评论并 @ 了团队。`, TRANSCRIPT_STEPS, true);
  $main.innerHTML = `
  <div class="topbar">
    <nav class="crumb" aria-label="面包屑"><a href="#list" data-l>自动化</a><span class="faint">/</span><a href="#detail" data-d>PR 积压提醒</a><span class="faint">/</span><strong class="tab">今天 ${live ? '10:31' : '10:00'}</strong></nav>
    <span class="status-pill">${live ? '<span class="dot breathe" style="background:var(--ok)"></span>运行中' : '<span class="dot" style="background:var(--ok)"></span>已完成'}</span>
    <button class="ibtn" aria-label="运行信息" data-aside>${I.panel}</button>
  </div>
  <div class="run-page">
    <div class="thread">
      <div class="msgs" id="msgs"><div class="msgs-inner" id="inner">
        <div class="trigger-card">
          <span class="muted" style="margin-top:2px">${live ? I.play : I.clock}</span>
          <div class="tc-body">
            <div><b style="font-weight:500">${live ? '手动运行' : '时间表触发'}</b><span class="faint"> · 今天 ${live ? '10:31' : '10:00'}</span></div>
            <div class="muted" style="font-size:12.5px;margin-top:2px">按自动化指令执行：列出仓库里所有打开的 PR，找出超过 24 小时还没有评审的…</div>
          </div>
        </div>
        ${first}
        ${state.msgs.map(m => m.role === 'user' ? `<div class="u-msg">${esc(m.text)}</div>` : agentBlock(m.text, m.steps || [], m.done)).join('')}
      </div></div>
      <div class="composer"><div class="composer-inner">
        ${state.queued.length ? `<div class="queue">排队中：${esc(state.queued[0])}${state.queued.length > 1 ? ` 等 ${state.queued.length} 条` : ''}</div>` : ''}
        <div class="input">
          <button class="ibtn sm" aria-label="添加附件">${I.attach}</button>
          <textarea id="ta" rows="1" placeholder="继续追问这次运行…" aria-label="消息"></textarea>
          ${state.busy ? `<button class="send" aria-label="停止" data-stop>${I.stop}</button>` : `<button class="send" aria-label="发送" data-send disabled>${I.send}</button>`}
        </div>
        <div class="input-foot"><span>与 代码管家 对话 · 沿用本次运行的工作目录和会话</span><span>Enter 发送</span></div>
      </div></div>
    </div>
    <aside class="aside ${state.aside ? 'force' : ''}" aria-label="运行信息">
      <div class="panel">
        <h4>运行信息</h4>
        <dl class="kv">
          <dt>状态</dt><dd>${live ? '运行中' : '已完成'}</dd>
          <dt>来源</dt><dd>${live ? '手动' : '时间表'}</dd>
          <dt>触发时间</dt><dd class="tab">今天 ${live ? '10:31' : '10:00'}</dd>
          <dt>完成时间</dt><dd class="tab">${live ? '—' : '今天 10:02'}</dd>
          <dt>执行者</dt><dd><span class="pv"><span class="av agent">代</span>代码管家</span></dd>
        </dl>
      </div>
      <div class="panel">
        <h4>Webhook 载荷 <span class="faint">仅 Webhook 运行</span></h4>
        <pre class="payload">{
  "action": "opened",
  "number": 818,
  "pull_request": { "title": "飞书登录回调" }
}</pre>
      </div>
      <div class="panel">
        <h4>自动化</h4>
        <a href="#detail" data-d2 style="color:inherit;text-decoration:none" class="pv">PR 积压提醒 ${I.right}</a>
      </div>
    </aside>
  </div>
  ${note('top:64px;left:24px', '只读弹窗 → 对话页', '原来点「查看执行日志」弹出只读记录。改为整页：执行过程作为第一轮智能体回复（步骤可折叠），底部是与聊天页同一个输入框，可以继续追问。')}
  ${note('bottom:110px;right:310px', '输入框', '运行中可以先打字，消息排队，本轮结束后发出；按钮变停止。与聊天页行为一致。')}
  ${note('top:64px;right:24px', '右侧运行信息', '状态、来源、时间、执行者和 Webhook 载荷（原弹窗顶部的载荷预览）。窄屏收起，点顶栏图标展开。')}
  `;
  $main.querySelector('[data-l]').onclick = (e) => { e.preventDefault(); go('list'); };
  $main.querySelectorAll('[data-d],[data-d2]').forEach(a => a.onclick = (e) => { e.preventDefault(); go('detail'); });
  $main.querySelector('[data-aside]').onclick = () => { state.aside = !state.aside; render(); };
  $main.querySelectorAll('[data-steps]').forEach(b => b.onclick = () => { const l = b.nextElementSibling; l.hidden = !l.hidden; b.innerHTML = (l.hidden ? I.right : I.chev) + b.textContent; });
  const ta = document.getElementById('ta');
  const send = $main.querySelector('[data-send]');
  ta.oninput = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; if (send) send.disabled = !ta.value.trim(); };
  ta.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(ta.value); } };
  if (send) send.onclick = () => submit(ta.value);
  const stop = $main.querySelector('[data-stop]'); if (stop) stop.onclick = () => { stop.disabled = true; setTimeout(() => { finishTurn('<span class="faint">已停止</span>'); }, 1500 * state_speed()); };
  const msgs = document.getElementById('msgs'); msgs.scrollTop = msgs.scrollHeight;
  if (state.live && !state._liveTimer) {
    state._liveTimer = setTimeout(() => { state._liveTimer = null; if (state.view !== 'run-live') return; state.live = false; state.view = 'run'; state.busy = false; flushQueue(); render(); toast('本次运行已完成'); }, 6000 * state_speed());
  }
}
function state_speed() { return 1; }
function esc(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function submit(text) {
  text = text.trim(); if (!text) return;
  if (state.busy) { state.queued.push(text); render(); return; }
  state.msgs.push({ role:'user', text }); state.busy = true;
  state.msgs.push({ role:'agent', text:'<span class="faint">思考中…</span>', steps:[], done:false });
  render();
  setTimeout(() => {
    const last = state.msgs[state.msgs.length - 1];
    last.steps = ['已读取 PR #815 的评审记录'];
    if (state.view.startsWith('run')) render();
  }, 1500);
  setTimeout(() => finishTurn('#815 卡在等待设计确认：评审人 4 小时前留言「等状态库分组的 ADR 定稿后再看」。我可以在 PR 下 @ 作者提醒补充 ADR 链接，需要的话回复「提醒」。'), 6000);
}
function finishTurn(text) {
  const last = state.msgs[state.msgs.length - 1];
  if (last && last.role === 'agent' && !last.done) { last.text = text; last.done = true; }
  state.busy = false; flushQueue();
  if (state.view.startsWith('run')) render();
}
function flushQueue() { if (state.queued.length) { const q = state.queued.shift(); setTimeout(() => submit(q), 300); } }

document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
document.getElementById('notes-toggle').onchange = (e) => document.body.classList.toggle('no-notes', !e.target.checked);
const initial = (location.hash || '').slice(1);
go(['list','empty','detail','run','run-live'].includes(initial) ? initial : 'list');
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== state.view && ['list','empty','detail','run','run-live'].includes(h)) go(h); });
</script>
