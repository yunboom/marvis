name: marvis

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: marvis
      POSTGRES_USER: ${POSTGRES_USER:-marvis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marvis}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
